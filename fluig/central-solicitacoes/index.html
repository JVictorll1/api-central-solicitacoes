<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central de Solicitações</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container py-5">
        <div class="mb-4">
            <h1>Central de Solicitações</h1>
            <p class="text-muted">Gerenciamento de solicitações internas</p>
        </div>
        <div id="mensagemSistema" class="alert d-none" role="alert"></div>

        <!-- FORMULÁRIO DE CRIAÇÃO -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <strong>Nova Solicitação</strong>
            </div>

            <div class="card-body">

                <form id="formSolicitacao">

                    <div class="row">

                        <div class="col-md-8 mb-3">
                            <label for="titulo" class="form-label">Título</label>
                            <input type="text" id="titulo" class="form-control" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="cpf" class="form-label">CPF do solicitante</label>
                            <input type="text" id="cpf" class="form-control" maxlength="11" required>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea id="descricao" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>

                        <select id="status" class="form-select">
                            <option value="ABERTA">ABERTA</option>
                            <option value="EM_ANALISE">EM ANÁLISE</option>
                            <option value="CONCLUIDA">CONCLUÍDA</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Criar Solicitação
                    </button>

                </form>

            </div>

        </div>

        <!-- LISTAGEM -->

        <div class="card shadow-sm">

            <div class="card-header d-flex justify-content-between align-items-center">

                <strong>Solicitações</strong>

                <button id="btnAtualizar" class="btn btn-outline-secondary btn-sm">
                    Atualizar
                </button>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>CPF</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>

                        </thead>

                        <tbody id="listaSolicitacoes"></tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- MODAL DETALHES -->

    <div class="modal fade" id="modalDetalhes" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Detalhes da Solicitação</h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">ID</label>
                            <input type="text" id="detalheId" class="form-control" disabled>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">CPF</label>
                            <input type="text" id="detalheCpf" class="form-control" disabled>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" id="detalheTitulo" class="form-control" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea id="detalheDescricao" class="form-control" rows="4" disabled></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <input type="text" id="detalheStatus" class="form-control" disabled>
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Fechar
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- MODAL EDITAR -->

    <div class="modal fade" id="modalEditar" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">Editar Solicitação</h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <input type="hidden" id="editarId">

                    <div class="mb-3">
                        <label for="editarTitulo" class="form-label">Título</label>
                        <input type="text" id="editarTitulo" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="editarDescricao" class="form-label">Descrição</label>
                        <textarea id="editarDescricao" class="form-control" rows="4"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="editarCpf" class="form-label">CPF</label>
                        <input type="text" id="editarCpf" class="form-control" maxlength="11">
                    </div>

                    <div class="mb-3">
                        <label for="editarStatus" class="form-label">Status</label>

                        <select id="editarStatus" class="form-select">
                            <option value="ABERTA">ABERTA</option>
                            <option value="EM_ANALISE">EM ANÁLISE</option>
                            <option value="CONCLUIDA">CONCLUÍDA</option>
                        </select>

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" id="btnSalvarEdicao" class="btn btn-primary">
                        Salvar alterações
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- MODAL ALTERAR STATUS -->

    <div class="modal fade" id="modalStatus" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">Alterar Status</h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <input type="hidden" id="statusId">

                    <label for="novoStatus" class="form-label">
                        Novo status
                    </label>

                    <select id="novoStatus" class="form-select">

                        <option value="ABERTA">ABERTA</option>
                        <option value="EM_ANALISE">EM ANÁLISE</option>
                        <option value="CONCLUIDA">CONCLUÍDA</option>

                    </select>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" id="btnSalvarStatus" class="btn btn-primary">
                        Salvar
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- MODAL CONFIRMAR EXCLUSÃO -->

    <div class="modal fade" id="modalExcluir" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">Cancelar Solicitação</h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <p class="mb-0">
                        Deseja realmente cancelar esta solicitação?
                    </p>

                    <input type="hidden" id="excluirId">

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Não
                    </button>

                    <button type="button" id="btnConfirmarExclusao" class="btn btn-danger">
                        Sim, cancelar
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
